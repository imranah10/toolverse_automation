name: ToolVerse 90-Day 4K PNG & Viral Reel Publisher

on:
  schedule:
    - cron: "30 13 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to publish (image or video)"
        required: true
        default: "image"
      day:
        description: "Day number (1-90)"
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ToolVerse Publish Engine
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: |
          SLOT="${{ github.event.inputs.slot || 'image' }}"
          DAY_ARG="${{ github.event.inputs.day != '' && format('--day={0}', github.event.inputs.day) || '' }}"
          node scripts/publish_engine.js --slot=$SLOT $DAY_ARG
      - name: Save Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || (git commit -m "chore: update published day state [skip ci]" && git pull --rebase origin main && git push)
