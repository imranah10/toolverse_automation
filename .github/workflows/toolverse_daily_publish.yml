name: Toolverse 90-Day Automation Engine

on:
  # Multi-Slot Daily Schedule (Tier-1 Peak Windows):
  # Slot 1: 1:30 PM UTC = 7:00 PM IST (US Morning 9:30 AM EDT & Europe Midday Peak) -> Infographic / Image
  # Slot 2: 5:30 PM UTC = 11:00 PM IST (US Afternoon 1:30 PM EDT & Reels Peak) -> Viral MP4 Video Reel & Story
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 17 * * *'
  
  # Manual trigger with custom options from GitHub Actions UI
  workflow_dispatch:
    inputs:
      slot:
        description: 'Publishing Slot (auto / image / video)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - image
          - video
      target_day:
        description: 'Specify Day Number to Publish (e.g. 8). Leave blank for auto-next.'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run (Simulate without making live posts)'
        type: boolean
        required: false
        default: false
      test_connection:
        description: 'Run Account & Token Connectivity Health Check only'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: Execute Daily Social Publishing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Toolverse Automation Engine
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          HOUR=$(date -u +%H)
          SLOT_FLAG=""
          if [ -n "${{ github.event.inputs.slot }}" ] && [ "${{ github.event.inputs.slot }}" != "auto" ]; then
            SLOT_FLAG="--slot=${{ github.event.inputs.slot }}"
          elif [ "$HOUR" -ge 16 ]; then
            SLOT_FLAG="--slot=video"
          else
            SLOT_FLAG="--slot=image"
          fi

          FLAGS="$SLOT_FLAG"
          if [ "${{ github.event.inputs.test_connection }}" = "true" ]; then
            FLAGS="--test"
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
            if [ -n "${{ github.event.inputs.target_day }}" ]; then
              FLAGS="$FLAGS --day=${{ github.event.inputs.target_day }}"
            fi
          elif [ -n "${{ github.event.inputs.target_day }}" ]; then
            FLAGS="$FLAGS --day=${{ github.event.inputs.target_day }}"
          fi
          
          echo "Executing: node scripts/publish_engine.js $FLAGS"
          node scripts/publish_engine.js $FLAGS

      - name: Commit and Push Updated State
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.test_connection != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain data/state.json)" ]; then
            git add data/state.json
            git commit -m "chore(automation): record daily published post [skip ci]"
            git push
            echo "✅ State updated and committed back to repository."
          else
            echo "No state change detected."
          fi
